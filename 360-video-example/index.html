<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Video Example - React Three Fiber (Legacy Safari)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #root {
            width: 100vw;
            height: 100vh;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .controls button {
            background: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .controls button:hover {
            background: #e0e0e0;
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            max-width: 300px;
        }

        .info h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }

        .info p {
            margin: 5px 0;
            line-height: 1.4;
        }

        .debug-info {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(255, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 300px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <div class="info">
        <h2>360 Video Viewer</h2>
        <p>Drag to look around</p>
        <p><strong>Works on iOS 15+</strong></p>
    </div>

    <div class="debug-info" id="debugInfo">Loading libraries...</div>

    <div class="controls">
        <button id="playPauseBtn">Play</button>
        <button id="muteBtn">Unmute</button>
    </div>

    <!-- Load libraries from CDN (UMD builds, no import maps needed) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/three@0.170.0/build/three.min.js" crossorigin></script>
    <script src="https://unpkg.com/@react-three/fiber@8/dist/react-three-fiber.umd.cjs" crossorigin></script>

    <script>
        const debugEl = document.getElementById('debugInfo');
        console.log('=== Starting 360 Video App (Legacy Mode) ===');

        // Check if libraries loaded
        window.addEventListener('load', () => {
            console.log('React:', typeof React);
            console.log('ReactDOM:', typeof ReactDOM);
            console.log('THREE:', typeof THREE);

            if (typeof React === 'undefined') {
                debugEl.textContent = 'Failed to load React';
                debugEl.style.background = 'rgba(255, 0, 0, 0.9)';
                return;
            }

            if (debugEl) {
                debugEl.textContent = 'Libraries loaded, creating app...';
                debugEl.style.background = 'rgba(128, 0, 128, 0.7)';
            }

            const { useState, useEffect, useRef, createElement: h } = React;
            const { createRoot } = ReactDOM;

            // Simple 360 video player without R3F (R3F UMD is tricky)
            function Video360Player() {
                const [videoStatus, setVideoStatus] = useState('Initializing...');
                const canvasRef = useRef();
                const videoRef = useRef();
                const sceneRef = useRef();

                useEffect(() => {
                    console.log('=== useEffect running ===');
                    console.log('canvasRef.current:', canvasRef.current);

                    if (!canvasRef.current) {
                        console.error('Canvas ref is null! Cannot initialize Three.js');
                        if (debugEl) {
                            debugEl.textContent = 'ERROR: Canvas not found';
                            debugEl.style.background = 'rgba(255, 0, 0, 0.9)';
                        }
                        return;
                    }

                    const video = document.createElement('video');
                    video.src = './videos/beach-360.mp4';
                    video.crossOrigin = 'anonymous';
                    video.loop = true;
                    video.muted = true;
                    video.playsInline = true;
                    videoRef.current = video;
                    window.videoElement = video;

                    video.addEventListener('loadeddata', () => {
                        setVideoStatus(`Video loaded: ${video.videoWidth}x${video.videoHeight}`);
                        if (debugEl) {
                            debugEl.textContent = `✓ Video loaded: ${video.videoWidth}x${video.videoHeight}`;
                            debugEl.style.background = 'rgba(0, 128, 255, 0.7)';
                        }
                    });

                    video.addEventListener('playing', () => {
                        setVideoStatus('✓ Video playing!');
                        if (debugEl) {
                            debugEl.textContent = '✓ Video is playing!';
                            debugEl.style.background = 'rgba(0, 255, 0, 0.7)';
                        }
                    });

                    video.addEventListener('error', (e) => {
                        const msg = `Error: ${video.error?.message || 'Failed to load'}`;
                        setVideoStatus(msg);
                        if (debugEl) {
                            debugEl.textContent = msg;
                            debugEl.style.background = 'rgba(255, 0, 0, 0.9)';
                        }
                    });

                    // Setup Three.js scene
                    const canvas = canvasRef.current;
                    console.log('Canvas element:', canvas);

                    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    console.log('Renderer created, size:', window.innerWidth, 'x', window.innerHeight);

                    const scene = new THREE.Scene();
                    scene.background = new THREE.Color(0x000033); // Dark blue to see if rendering works

                    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 0, 0.1);
                    console.log('Scene and camera created');

                    // Create 360 video sphere
                    const geometry = new THREE.SphereGeometry(500, 64, 32);
                    geometry.scale(-1, 1, 1); // Invert to see from inside

                    const texture = new THREE.VideoTexture(video);
                    texture.minFilter = THREE.LinearFilter;
                    texture.magFilter = THREE.LinearFilter;
                    texture.colorSpace = THREE.SRGBColorSpace;

                    const material = new THREE.MeshBasicMaterial({
                        map: texture,
                        side: THREE.FrontSide, // Use FrontSide because geometry is already inverted
                        toneMapped: false
                    });

                    const mesh = new THREE.Mesh(geometry, material);
                    scene.add(mesh);

                    // Add a test cube to verify rendering is working
                    const cubeGeometry = new THREE.BoxGeometry(10, 10, 10);
                    const cubeMaterial = new THREE.MeshBasicMaterial({
                        color: 0xff0000,
                        wireframe: true
                    });
                    const testCube = new THREE.Mesh(cubeGeometry, cubeMaterial);
                    testCube.position.set(0, 0, -30);
                    scene.add(testCube);

                    sceneRef.current = { scene, camera, renderer, mesh, testCube };

                    // Simple orbit controls (mouse drag)
                    let isDragging = false;
                    let previousMousePosition = { x: 0, y: 0 };
                    const rotationSpeed = 0.005;

                    canvas.addEventListener('mousedown', (e) => {
                        isDragging = true;
                        previousMousePosition = { x: e.clientX, y: e.clientY };
                    });

                    canvas.addEventListener('mousemove', (e) => {
                        if (isDragging) {
                            const deltaX = e.clientX - previousMousePosition.x;
                            const deltaY = e.clientY - previousMousePosition.y;

                            camera.rotation.y += deltaX * rotationSpeed;
                            camera.rotation.x += deltaY * rotationSpeed;
                            camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));

                            previousMousePosition = { x: e.clientX, y: e.clientY };
                        }
                    });

                    canvas.addEventListener('mouseup', () => isDragging = false);
                    canvas.addEventListener('mouseleave', () => isDragging = false);

                    // Touch support
                    canvas.addEventListener('touchstart', (e) => {
                        if (e.touches.length === 1) {
                            isDragging = true;
                            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                        }
                    });

                    canvas.addEventListener('touchmove', (e) => {
                        if (isDragging && e.touches.length === 1) {
                            const deltaX = e.touches[0].clientX - previousMousePosition.x;
                            const deltaY = e.touches[0].clientY - previousMousePosition.y;

                            camera.rotation.y += deltaX * rotationSpeed;
                            camera.rotation.x += deltaY * rotationSpeed;
                            camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));

                            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                        }
                    });

                    canvas.addEventListener('touchend', () => isDragging = false);

                    // Render loop - update texture every frame
                    function animate() {
                        requestAnimationFrame(animate);

                        // Rotate test cube
                        testCube.rotation.x += 0.01;
                        testCube.rotation.y += 0.01;

                        // Update video texture
                        if (video.readyState >= video.HAVE_CURRENT_DATA) {
                            texture.needsUpdate = true;
                        }

                        renderer.render(scene, camera);
                    }
                    animate();

                    // Handle resize
                    const handleResize = () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    };
                    window.addEventListener('resize', handleResize);

                    // Load and play video
                    video.load();
                    video.play().catch(err => {
                        console.warn('Autoplay failed:', err);
                        if (debugEl) {
                            debugEl.textContent = 'Tap PLAY to start';
                            debugEl.style.background = 'rgba(255, 165, 0, 0.7)';
                        }
                    });

                    return () => {
                        window.removeEventListener('resize', handleResize);
                        renderer.dispose();
                        geometry.dispose();
                        material.dispose();
                        texture.dispose();
                    };
                }, []);

                return h('canvas', {
                    ref: canvasRef,
                    style: {
                        display: 'block',
                        position: 'absolute',
                        top: 0,
                        left: 0,
                        width: '100vw',
                        height: '100vh',
                        border: '5px solid red' // Make it very obvious
                    }
                });
            }

            // Mount app
            try {
                const root = createRoot(document.getElementById('root'));
                root.render(h(Video360Player));
                console.log('✓ App mounted successfully');
            } catch (err) {
                console.error('Failed to mount:', err);
                debugEl.textContent = `Mount error: ${err.message}`;
                debugEl.style.background = 'rgba(255, 0, 0, 0.9)';
            }
        });

        // Control buttons
        document.getElementById('playPauseBtn').addEventListener('click', () => {
            const video = window.videoElement;
            const btn = document.getElementById('playPauseBtn');

            if (video && video.paused) {
                video.play();
                btn.textContent = 'Pause';
            } else if (video) {
                video.pause();
                btn.textContent = 'Play';
            }
        });

        document.getElementById('muteBtn').addEventListener('click', () => {
            const video = window.videoElement;
            const btn = document.getElementById('muteBtn');

            if (video) {
                video.muted = !video.muted;
                btn.textContent = video.muted ? 'Unmute' : 'Mute';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Video Example - Interactive Portals</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #root {
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .controls button {
            background: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .controls button:hover {
            background: #e0e0e0;
        }

        .controls button:active {
            transform: scale(0.98);
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            max-width: 300px;
        }

        .info h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }

        .info p {
            margin: 5px 0;
            line-height: 1.4;
        }

        .scene-info {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            max-width: 250px;
        }

        .scene-info h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }

        .portal-label {
            position: absolute;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
            transform: translate(-50%, -100%);
            margin-top: -10px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="root">
        <canvas id="canvas"></canvas>
    </div>

    <div class="info">
        <h2>360 Video Viewer</h2>
        <p>Drag to look around</p>
        <p>Scroll to zoom</p>
        <p><strong>Click portals to switch scenes</strong></p>
    </div>

    <div class="scene-info">
        <h3 id="sceneName">Scene 1</h3>
        <p id="sceneDesc">Beach</p>
    </div>

    <div class="portal-label" id="portalLabel"></div>

    <div class="controls">
        <button id="playPauseBtn">Play</button>
        <button id="muteBtn">Unmute</button>
    </div>

    <script src="https://unpkg.com/three@0.170.0/build/three.min.js" crossorigin></script>

    <script>
        // === Scene configuration ===
        const VIDEO_SCENES = [
            {
                id: 0,
                name: 'Scene 1',
                description: 'Beach',
                src: './videos/beach-360.mp4',
                portalPosition: new THREE.Vector3(0, 0, -80),
                portalColor: 0x4fc3f7
            },
            {
                id: 1,
                name: 'Scene 2',
                description: 'Mountain',
                src: './videos/mountain-360.mp4',
                portalPosition: new THREE.Vector3(-70, 0, 40),
                portalColor: 0x81c784
            },
            {
                id: 2,
                name: 'Scene 3',
                description: 'City',
                src: './videos/city-360.mp4',
                portalPosition: new THREE.Vector3(70, 0, 40),
                portalColor: 0xffb74d
            }
        ];

        let currentSceneIndex = 0;

        // === Three.js setup ===
        const canvas = document.getElementById('canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
            75, window.innerWidth / window.innerHeight, 0.1, 1000
        );
        camera.position.set(0, 0, 0.1);

        // === Video element ===
        const video = document.createElement('video');
        video.crossOrigin = 'anonymous';
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.src = VIDEO_SCENES[0].src;
        window.videoElement = video;

        // === 360 video sphere ===
        const sphereGeometry = new THREE.SphereGeometry(500, 64, 32);
        sphereGeometry.scale(-1, 1, 1); // Invert to view from inside

        const videoTexture = new THREE.VideoTexture(video);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        videoTexture.colorSpace = THREE.SRGBColorSpace;

        const sphereMaterial = new THREE.MeshBasicMaterial({
            map: videoTexture,
            side: THREE.FrontSide,
            toneMapped: false
        });

        const videoSphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        scene.add(videoSphere);

        // === Lighting for portal spheres ===
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const pointLight = new THREE.PointLight(0xffffff, 1, 300);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        // === Portal spheres ===
        const portalMeshes = [];
        const portalGlowMeshes = [];

        VIDEO_SCENES.forEach((sceneConfig) => {
            // Inner solid sphere
            const portalGeometry = new THREE.SphereGeometry(5, 32, 32);
            const portalMaterial = new THREE.MeshStandardMaterial({
                color: sceneConfig.portalColor,
                emissive: sceneConfig.portalColor,
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.85,
                roughness: 0.2,
                metalness: 0.3
            });
            const portalMesh = new THREE.Mesh(portalGeometry, portalMaterial);
            portalMesh.position.copy(sceneConfig.portalPosition);
            portalMesh.userData = { sceneId: sceneConfig.id, baseY: sceneConfig.portalPosition.y };
            scene.add(portalMesh);
            portalMeshes.push(portalMesh);

            // Outer glow sphere
            const glowGeometry = new THREE.SphereGeometry(7, 32, 32);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: sceneConfig.portalColor,
                transparent: true,
                opacity: 0.15,
                side: THREE.BackSide
            });
            const glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
            glowMesh.position.copy(sceneConfig.portalPosition);
            glowMesh.userData = { baseY: sceneConfig.portalPosition.y };
            scene.add(glowMesh);
            portalGlowMeshes.push(glowMesh);
        });

        function updatePortalVisibility() {
            portalMeshes.forEach((mesh, i) => {
                const visible = i !== currentSceneIndex;
                mesh.visible = visible;
                portalGlowMeshes[i].visible = visible;
            });
        }
        updatePortalVisibility();

        // === Raycaster for portal clicks ===
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredPortal = null;
        const portalLabel = document.getElementById('portalLabel');

        function getVisiblePortals() {
            return portalMeshes.filter((_, i) => i !== currentSceneIndex);
        }

        function onPointerMove(event) {
            const rect = canvas.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(getVisiblePortals());

            if (intersects.length > 0) {
                const portal = intersects[0].object;
                if (hoveredPortal !== portal) {
                    // Reset previous hover
                    if (hoveredPortal) {
                        hoveredPortal.material.emissiveIntensity = 0.5;
                    }
                    hoveredPortal = portal;
                    portal.material.emissiveIntensity = 1.5;
                    canvas.style.cursor = 'pointer';

                    // Show label
                    const sceneConfig = VIDEO_SCENES[portal.userData.sceneId];
                    portalLabel.textContent = sceneConfig.name + ' - ' + sceneConfig.description;
                    portalLabel.style.display = 'block';
                }

                // Update label position
                const portalPos = portal.position.clone();
                portalPos.project(camera);
                const x = (portalPos.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-portalPos.y * 0.5 + 0.5) * window.innerHeight;
                portalLabel.style.left = x + 'px';
                portalLabel.style.top = y + 'px';
            } else {
                if (hoveredPortal) {
                    hoveredPortal.material.emissiveIntensity = 0.5;
                    hoveredPortal = null;
                    canvas.style.cursor = 'grab';
                    portalLabel.style.display = 'none';
                }
            }
        }

        function onPointerClick(event) {
            // Don't trigger click if we were dragging
            if (dragDistance > 5) return;

            const rect = canvas.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(getVisiblePortals());

            if (intersects.length > 0) {
                const sceneId = intersects[0].object.userData.sceneId;
                switchScene(sceneId);
            }
        }

        function switchScene(sceneId) {
            if (sceneId === currentSceneIndex) return;

            currentSceneIndex = sceneId;
            const sceneConfig = VIDEO_SCENES[sceneId];

            // Update video source
            video.src = sceneConfig.src;
            video.load();
            video.play().catch(() => {});

            // Update portal visibility
            updatePortalVisibility();

            // Update UI
            document.getElementById('sceneName').textContent = sceneConfig.name;
            document.getElementById('sceneDesc').textContent = sceneConfig.description;

            // Reset hover state
            hoveredPortal = null;
            portalLabel.style.display = 'none';
            canvas.style.cursor = 'grab';
        }

        // === Orbit controls (mouse drag to rotate camera) ===
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let dragDistance = 0;
        const rotationSpeed = 0.003;

        // Spherical coordinates for smooth orbit
        let phi = Math.PI / 2;   // vertical angle (0 = top, PI = bottom)
        let theta = 0;           // horizontal angle

        function updateCameraFromSpherical() {
            const r = 0.1;
            camera.position.set(
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi),
                r * Math.sin(phi) * Math.cos(theta)
            );
            camera.lookAt(0, 0, 0);
        }
        updateCameraFromSpherical();

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragDistance = 0;
            previousMousePosition = { x: e.clientX, y: e.clientY };
            canvas.style.cursor = 'grabbing';
        });

        canvas.addEventListener('mousemove', (e) => {
            onPointerMove(e);
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

                theta -= deltaX * rotationSpeed;
                phi += deltaY * rotationSpeed;
                phi = Math.max(0.1, Math.min(Math.PI - 0.1, phi));

                updateCameraFromSpherical();
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            isDragging = false;
            canvas.style.cursor = 'grab';
            onPointerClick(e);
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            canvas.style.cursor = 'grab';
        });

        // Touch support
        let touchStartPos = { x: 0, y: 0 };

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                dragDistance = 0;
                previousMousePosition = {
                    x: e.touches[0].clientX,
                    y: e.touches[0].clientY
                };
                touchStartPos = {
                    x: e.touches[0].clientX,
                    y: e.touches[0].clientY
                };
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;
                dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

                theta -= deltaX * rotationSpeed;
                phi += deltaY * rotationSpeed;
                phi = Math.max(0.1, Math.min(Math.PI - 0.1, phi));

                updateCameraFromSpherical();
                previousMousePosition = {
                    x: e.touches[0].clientX,
                    y: e.touches[0].clientY
                };
            }
        });

        canvas.addEventListener('touchend', (e) => {
            isDragging = false;
            // Detect tap for portal clicks
            if (dragDistance < 10) {
                const fakeEvent = {
                    clientX: touchStartPos.x,
                    clientY: touchStartPos.y
                };
                // Set mouse for raycaster
                const rect = canvas.getBoundingClientRect();
                mouse.x = ((fakeEvent.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((fakeEvent.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(getVisiblePortals());
                if (intersects.length > 0) {
                    const sceneId = intersects[0].object.userData.sceneId;
                    switchScene(sceneId);
                }
            }
        });

        // Scroll to zoom (adjust FOV)
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            camera.fov = Math.max(30, Math.min(100, camera.fov + e.deltaY * 0.05));
            camera.updateProjectionMatrix();
        }, { passive: false });

        // Set initial cursor
        canvas.style.cursor = 'grab';

        // === Animation loop ===
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();

            // Animate portal spheres (floating + rotation)
            portalMeshes.forEach((mesh, i) => {
                if (mesh.visible) {
                    mesh.rotation.y += 0.01;
                    mesh.position.y = mesh.userData.baseY + Math.sin(elapsed * 2 + i * 2) * 2;
                    portalGlowMeshes[i].position.y = mesh.position.y;
                    portalGlowMeshes[i].rotation.y -= 0.005;
                }
            });

            // Update video texture
            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                videoTexture.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }
        animate();

        // === Window resize ===
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // === Start video playback ===
        video.load();
        video.play().catch(() => {});

        // === Control buttons ===
        document.getElementById('playPauseBtn').addEventListener('click', () => {
            const btn = document.getElementById('playPauseBtn');
            if (video.paused) {
                video.play();
                btn.textContent = 'Pause';
            } else {
                video.pause();
                btn.textContent = 'Play';
            }
        });

        document.getElementById('muteBtn').addEventListener('click', () => {
            const btn = document.getElementById('muteBtn');
            video.muted = !video.muted;
            btn.textContent = video.muted ? 'Unmute' : 'Mute';
        });
    </script>
</body>
</html>
